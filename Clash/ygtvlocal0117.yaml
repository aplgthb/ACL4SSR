
port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true
global-client-fingerprint: chrome
dns:
  enable: false
  listen: :53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver: 
    - 223.5.5.5
    - 114.114.114.114
    - 8.8.8.8
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.0.0.1/dns-query
    - tls://dns.google
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

proxies:
- name: USA
  type: vless
  server: usa.visa.com
  port: 443
  uuid: 8c2a1f50-8b48-41bf-943c-9f6e49d5082e
  udp: false
  tls: true
  network: ws
  servername: apyg1002.ap0513.ggff.net
  ws-opts:
    path: "/?ed=2560"
    headers:
      Host: apyg1002.ap0513.ggff.net

